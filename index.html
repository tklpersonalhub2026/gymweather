<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Weather">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Gym Weather</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#0f1a26;--card:#16263a;--line:#22344a;--text:#f4f6f8;--sub:#9fb0c2;--faint:#5f7489;--rain:#85b7eb;--rainbg:#13314f;--snow:#3c3489;--snowtext:#cecbf6;--hi:#f0997b;--lo:#85b7eb;--warn:#a32d2d;--watch:#b56a0b;--accent:#185fa5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
.top{height:calc(8vh + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)!important;display:flex;align-items:center;justify-content:space-between;padding:0 2.5vw;font-size:2.4vh;color:var(--sub);flex:none}
.top .place{color:var(--text);font-weight:600;font-size:2.8vh}
.pill{background:var(--accent);color:#fff;border-radius:99px;padding:.9vh 2vw;font-size:2.3vh;font-weight:600}
.pill.ghost{background:var(--card);color:var(--sub)}
.tbtns{display:flex;gap:1.2vw;align-items:center}
.hero{flex:1;display:grid;grid-template-columns:56% 44%;padding:0 2.5vw;min-height:0}
.now{display:flex;align-items:center;gap:2vw}
.now svg.big{width:22vh;height:22vh;flex:none}
.temp{font-size:30vh;font-weight:600;line-height:.85;letter-spacing:-.5vh}
.cond{font-size:5.5vh;font-weight:600;margin-top:1vh}
.feels{font-size:2.8vh;color:var(--sub);margin-top:.4vh}
.today{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.2vw;align-content:center}
.hilo{grid-column:1/3;font-size:7.5vh;font-weight:600}
.hilo small{font-size:2.6vh;color:var(--sub);font-weight:400;margin-left:.8vw}
.tile{border-radius:1.4vh;padding:1.6vh 1.4vw;background:var(--card)}
.tile.rain{background:var(--rainbg)}
.tile.snowy{background:var(--snow)}
.tile .v{font-size:8vh;font-weight:600;line-height:1}
.tile.rain .v{color:var(--rain)}
.tile.snowy .v{color:#fff}
.tile .l{font-size:2.4vh;color:var(--sub);margin-top:.6vh}
.tile.snowy .l{color:var(--snowtext)}
.wind,.soon{grid-column:1/3;font-size:2.8vh;color:var(--sub)}
.soon{color:var(--text)}
.strip{flex:none;height:27vh;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:1fr 5vh}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;border-left:1px solid var(--line);font-size:2.5vh}
.day:first-child{border-left:none}
.day .dn{color:var(--sub)}
.day svg{width:6vh;height:6vh}
.day .p{color:var(--rain);font-size:2.5vh;font-weight:600}
.day .p.dry{color:#c3ccda;font-weight:500}
.badge{background:var(--snow);color:#fff;border-radius:.6vh;padding:0 .6vw;font-size:2.2vh;font-weight:600}
.band{grid-column:1/11;position:relative;border-top:1px solid var(--line)}
.band svg{position:absolute;inset:0;width:100%;height:100%}
.alert{flex:none;height:9vh;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:4vh;font-weight:600;color:#fff}
.alert.warn{background:var(--warn)}.alert.watch{background:var(--watch)}
.alert .run{display:inline-block;padding-left:100%;animation:scroll linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.4vh 1.4vw;padding:0 2.5vw 2.5vh;min-height:0;touch-action:none}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.ct{background:var(--card);border-radius:1.4vh;padding:0 1.8vw;display:grid;grid-template-columns:1fr auto;align-items:center;transition:box-shadow .15s}
.ct .n{font-size:2.8vh;font-weight:600}
.ct .x{font-size:2.2vh;color:var(--sub);margin-top:.3vh}
.ct .t{display:flex;align-items:center;gap:.8vw;font-size:6vh;font-weight:600}
.ct svg{width:6vh;height:6vh}
.ct.lift{position:relative;z-index:5;box-shadow:0 1.5vh 4vh rgba(0,0,0,.6);outline:2px solid var(--rain);transition:none;opacity:.92}
.ct.drop{outline:3px dashed var(--rain);outline-offset:-3px;background:#1d3550}
.day{cursor:pointer}
.day.sel{background:var(--card);box-shadow:inset 0 .5vh 0 var(--rain)}
#dpop{position:absolute;left:2.5vw;right:2.5vw;top:9vh;bottom:28vh;z-index:30;background:#13212f;border:1px solid var(--line);border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.6);padding:3vh 3vw;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:2vh 3vw;cursor:pointer}
#dpop .dh{grid-column:1/3;display:flex;align-items:center;justify-content:space-between}
#dpop .dt{font-size:5vh;font-weight:700}
#dpop .dx{font-size:2.4vh;color:var(--sub)}
#dpop .dl{display:flex;flex-direction:column;justify-content:center;gap:1.4vh}
#dpop .dl svg{width:14vh;height:14vh}
#dpop .dw{font-size:4.5vh;font-weight:600}
#dpop .dhl{font-size:8vh;font-weight:600;line-height:1}
#dpop .dsub{font-size:2.6vh;color:var(--sub)}
#dpop .dr{display:flex;flex-direction:column;justify-content:center;gap:1.6vh}
#dpop .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw}
#dpop .pt{background:var(--card);border-radius:1.2vh;padding:1.4vh .8vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4vh}
#dpop .pt .pn{font-size:2.2vh;color:var(--sub)}
#dpop .pt svg{width:6vh;height:6vh}
#dpop .pt .pv{font-size:3.6vh;font-weight:600}
#dpop .pt .pp{font-size:2.2vh;color:var(--rain)}
#dpop .facts{display:grid;grid-template-columns:1fr 1fr;gap:1vh 2vw;font-size:2.7vh}
#dpop .facts b{color:var(--sub);font-weight:400;margin-right:.6vw}
.hint{font-size:2vh;color:var(--faint);text-align:center;padding-bottom:1.2vh;flex:none}
#dim{position:absolute;inset:0;background:#000;opacity:.88;z-index:50}
#dim span{position:absolute;bottom:3vh;width:100%;text-align:center;color:#555;font-size:2vh}
#dim-wrap{position:absolute;inset:0;z-index:50}
#dim-wrap #dim{z-index:auto}
#d-bright{position:absolute;z-index:51;border:2px solid #85b7eb;color:#cfe3f7;background:#0b1520;border-radius:3vh;font-size:2.4vh;font-weight:600;padding:0 1.4vw;display:flex;align-items:center;justify-content:center}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center}
.sheet{background:#13212f;border-radius:2vh;width:62vw;max-height:88vh;display:flex;flex-direction:column;padding:2.5vh 2vw;gap:1.5vh}
.sheet h2{font-size:3.2vh;font-weight:600}
.sheet .row{display:flex;justify-content:space-between;align-items:center;padding:1.2vh 0;border-bottom:1px solid var(--line);font-size:2.6vh}
.sheet .row button{color:var(--sub);font-size:2.4vh;padding:.6vh 1vw}
.sheet input{font:inherit;font-size:2.8vh;padding:1.2vh 1vw;border-radius:1vh;border:1px solid var(--line);background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
.list{overflow:auto;min-height:0}
.sub{color:var(--sub);font-size:2.2vh}
.err{position:absolute;bottom:1vh;left:2.5vw;font-size:1.8vh;color:var(--faint)}
#dpop .dt,#dpop .dhl,#dpop .pt .pv,.temp,.cond,.hilo,.tile .v,.top .place,.pill,.ct .n,.ct .t,.day .dn,.cal .ttl,.ev .tm,.ncol h3,.ni .h{font-family:"Barlow Condensed",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.top .place{font-size:3.4vh;letter-spacing:.03em}
.pill{font-size:2.7vh}
.cal{flex:none;height:27vh;border-top:1px solid var(--line);padding:1.6vh 2.5vw 1.8vh;display:flex;flex-direction:column;gap:1.2vh}
.cal .hd{display:flex;align-items:center;justify-content:space-between}
.cal .ttl{font-size:3.4vh;font-weight:700;letter-spacing:.05em}
.cal .ttl small{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:2vh;color:var(--sub);font-weight:400;letter-spacing:0;margin-left:1.2vw}
.cal .evs{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1vw;min-height:0}
.ev{background:#f4f6f8;color:#0f1a26;border-radius:1.4vh;padding:1.2vh 1.2vw;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.ev .tm{font-size:4.2vh;font-weight:700;line-height:1.05}
.ev .tt{font-size:2.6vh;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .cn{font-size:1.9vh;color:#4a5568;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.quiet{background:var(--card);color:var(--sub)}
.cal .ttl{flex:none}
.chips{flex:1;display:flex;gap:.8vw;margin:0 1.5vw;overflow:hidden;min-width:0}
.chip{flex:none;max-width:22vw;background:#f5d38a;color:#1a1300;border-radius:99px;padding:.6vh 1.2vw;font-size:2.3vh;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw;padding:1vh 2.5vw 2.5vh;min-height:0}
.ncol{display:flex;flex-direction:column;min-height:0}
.ncol h3{font-size:4vh;font-weight:700;letter-spacing:.05em;border-bottom:.4vh solid var(--rain);padding-bottom:.6vh;display:flex;justify-content:space-between;align-items:baseline;flex:none}
.ncol h3 small{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:1.8vh;color:var(--sub);font-weight:400;letter-spacing:0}
.nlist{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:1.2vh;padding-top:1.2vh;min-height:0}
.ni{display:block;flex:none;background:var(--card);border-radius:1.4vh;padding:1.4vh 1.2vw;color:var(--text);text-decoration:none}
.ni .s{font-size:1.8vh;font-weight:600;color:var(--rain);letter-spacing:.04em;text-transform:uppercase}
.ni .h{font-size:3.1vh;font-weight:600;line-height:1.15;margin-top:.4vh}
.ni .d{font-size:2vh;line-height:1.35;color:#c3ccda;margin-top:.6vh;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>

<div id="board" class="view">
  <div class="top">
    <span class="place" id="b-place">Hideout, UT</span>
    <span id="b-clock"></span>
    <span class="tbtns">
      <button class="pill hidden" id="b-back">Home</button>
      <button class="pill" id="b-cities">Cities</button>
      <button class="pill" id="b-news">News</button>
      <button class="pill ghost" id="b-dim" aria-label="Dim screen">Dim</button>
    </span>
  </div>
  <div class="hero">
    <div class="now">
      <div id="b-icon"></div>
      <div>
        <div class="temp" id="b-temp">--°</div>
        <div class="cond" id="b-cond"></div>
        <div class="feels" id="b-feels"></div>
      </div>
    </div>
    <div class="today">
      <div class="hilo" id="b-hilo"></div>
      <div class="tile" id="b-rain"><div class="v">--</div><div class="l">rain</div></div>
      <div class="tile" id="b-snow"><div class="v">--</div><div class="l">snow today</div></div>
      <div class="soon" id="b-soon"></div>
      <div class="wind" id="b-wind"></div>
    </div>
  </div>
  <div class="strip" id="b-strip"></div>
  <div class="cal hidden" id="b-cal"></div>
  <div class="alert hidden" id="b-alert"><span class="run" id="b-alert-text"></span></div>
  <div class="err" id="b-err"></div>
  <div id="dpop" class="hidden"></div>
</div>

<div id="cities" class="view hidden">
  <div class="top">
    <button class="pill" id="c-home">Home</button>
    <span id="c-count"></span>
    <button class="pill ghost" id="c-edit">Edit cities</button>
  </div>
  <div class="grid" id="c-grid"></div>
  <div class="hint">Tap a city for its full forecast. Press and hold, carry it onto another city, and let go — the two swap places. · v<span id="c-ver"></span></div>
</div>

<div id="news" class="view hidden">
  <div class="top">
    <span class="tbtns"><button class="pill" id="n-home">Home</button><span class="place">News</span></span>
    <span id="n-stamp"></span>
  </div>
  <div class="news" id="n-cols"></div>
</div>

<div class="modal hidden" id="editor">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Edit cities</h2><button class="pill" id="e-done">Done</button>
    </div>
    <input id="e-search" placeholder="Add a city or ZIP code" autocomplete="off">
    <div class="list" id="e-results"></div>
    <div class="list" id="e-list"></div>
    <div class="row"><span>Home: <b id="e-home"></b></span><button id="e-sethome">Change home</button></div>
  </div>
</div>

<div id="dim-wrap" class="hidden"><div id="dim"><span>Tap anywhere to brighten</span></div><button id="d-bright" aria-label="Brighten screen">Bright</button></div>

<script>
var VERSION = "1.7";
var DEFAULT_HOME = {name:"Hideout, UT", lat:40.6436, lon:-111.3985};
var DEFAULT_CITIES = [
  {name:"Park City, UT", lat:40.6461, lon:-111.4980},
  {name:"Salt Lake City, UT", lat:40.7608, lon:-111.8910},
  {name:"Phoenix, AZ", lat:33.4484, lon:-112.0740},
  {name:"Meriden, CT", lat:41.5382, lon:-72.8070},
  {name:"Lorton, VA", lat:38.7043, lon:-77.2278},
  {name:"Philadelphia, PA", lat:39.9526, lon:-75.1652},
  {name:"Costa Mesa, CA", lat:33.6411, lon:-117.9187},
  {name:"Lamar Valley, WY", lat:44.8986, lon:-110.2234},
  {name:"Ho Chi Minh City", lat:10.8231, lon:106.6297},
  {name:"Hanoi", lat:21.0278, lon:105.8342}
];
var NEWS_SECONDS = 180, CITY_SECONDS = 30, MAX_CITIES = 15, REFRESH_MS = 10*60*1000;

function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var home = load("gw-home", DEFAULT_HOME);
var cities = load("gw-cities", DEFAULT_CITIES);
var $ = function(id){ return document.getElementById(id); };

var CLOUD = '<path d="M17 44h30a10 10 0 0 0 1-20 14 14 0 0 0-27-2 11 11 0 0 0-4 22z" fill="#b4b2a9"/>';
var CLOUD_UP = '<path d="M17 36h30a10 10 0 0 0 1-20 14 14 0 0 0-27-2 11 11 0 0 0-4 22z" fill="#b4b2a9"/>';
function sun(cx, cy, r){ var s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fac775"/>';
  for (var i=0;i<8;i++){ var a=i*Math.PI/4, x1=cx+Math.cos(a)*(r+4), y1=cy+Math.sin(a)*(r+4), x2=cx+Math.cos(a)*(r+9), y2=cy+Math.sin(a)*(r+9);
    s += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#fac775" stroke-width="3.5" stroke-linecap="round"/>'; }
  return s; }
var MOON = '<path d="M38 12a20 20 0 1 0 16 30A16 16 0 0 1 38 12z" fill="#d3d1c7"/>';
function drops(color, n){ var s=''; for (var i=0;i<n;i++){ var x=22+i*10; s+='<line x1="'+x+'" y1="42" x2="'+(x-4)+'" y2="54" stroke="'+color+'" stroke-width="4" stroke-linecap="round"/>'; } return s; }
function flakes(){ var s=''; [22,32,42].forEach(function(x,i){ var y=i%2?52:46; s+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="#e6f1fb"/>'; }); return s; }
var BOLT = '<path d="M33 38l-7 12h7l-4 10 12-15h-7l4-7z" fill="#fac775"/>';
var FOG = '<line x1="14" y1="44" x2="50" y2="44" stroke="#888780" stroke-width="4" stroke-linecap="round"/><line x1="18" y1="52" x2="46" y2="52" stroke="#888780" stroke-width="4" stroke-linecap="round"/>';
function icon(code, isDay, cls){
  var b;
  if (code===0) b = isDay ? sun(32,32,12) : MOON;
  else if (code===1||code===2) b = (isDay ? sun(22,22,9) : '<path d="M24 6a14 14 0 1 0 12 22A11 11 0 0 1 24 6z" fill="#d3d1c7"/>') + CLOUD;
  else if (code===3) b = CLOUD;
  else if (code===45||code===48) b = CLOUD_UP + FOG;
  else if ([51,53,55,56,57].indexOf(code)>=0) b = CLOUD_UP + drops("#85b7eb",2);
  else if ([61,63,65,66,67,80,81,82].indexOf(code)>=0) b = CLOUD_UP + drops("#85b7eb",3);
  else if ([71,73,75,77,85,86].indexOf(code)>=0) b = CLOUD_UP + flakes();
  else if (code>=95) b = CLOUD_UP + BOLT;
  else b = CLOUD;
  return '<svg class="'+(cls||'')+'" viewBox="0 0 64 64" aria-hidden="true">'+b+'</svg>';
}
var WORDS = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",95:"Thunderstorms",96:"Storms with hail",99:"Storms with hail"};
function isSnowCode(c){ return [71,73,75,77,85,86].indexOf(c)>=0; }
var DIRS = ["N","NE","E","SE","S","SW","W","NW"];
function dir(d){ return DIRS[Math.round(d/45)%8]; }
function r(x){ return Math.round(x); }
function inches(x){ return x>=1 ? (Math.round(x*10)/10).toString().replace(/\.0$/,"") : x.toFixed(2); }
function snowIn(x){ return x>=1 ? Math.round(x)+'"' : (Math.round(x*10)/10).toFixed(1)+'"'; }
function hourLabel(iso){ var h = parseInt(iso.slice(11,13),10); return (h%12||12)+(h<12?" am":" pm"); }

function forecastUrl(lats, lons, days){
  return "https://api.open-meteo.com/v1/forecast?latitude="+lats+"&longitude="+lons+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day"+
    "&hourly=precipitation_probability,precipitation,snowfall,weather_code,temperature_2m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,rain_sum,showers_sum,snowfall_sum,apparent_temperature_max,apparent_temperature_min,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset,uv_index_max"+
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days="+days;
}
function getJSON(url){ return fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }

var boardCity = null, boardData = {};
function showBoard(city){
  closePop();
  boardCity = city || home;
  var away = !!city;
  $("b-back").classList.toggle("hidden", !away);
  $("b-cities").classList.toggle("hidden", away);
  $("b-news").classList.toggle("hidden", away);
  show("board");
  var key = boardCity.lat+","+boardCity.lon;
  if (boardData[key]) renderBoard(boardData[key].w, boardData[key].a);
  return refreshBoard();
}
function refreshBoard(){
  var c = boardCity;
  return getJSON(forecastUrl(c.lat, c.lon, 11)).then(function(w){
    return getAlerts(c).then(function(a){
      boardData[c.lat+","+c.lon] = {w:w, a:a};
      if (boardCity===c) renderBoard(w, a);
      $("b-err").textContent = "";
    });
  }).catch(function(e){ $("b-err").textContent = "Can't reach the weather service. Retrying shortly."; });
}
function getAlerts(c){

function hm(iso){ var t = iso.slice(11,16).split(":"), hh = +t[0]; return (hh%12||12)+":"+t[1]+(hh<12?" am":" pm"); }
function openPop(i){

function soonLine(h, nowIso){
  var i0 = h.time.indexOf(nowIso.slice(0,13)+":00"); if (i0<0) return "";
  var kind = function(i){ return ((h.snowfall[i]||0)>0 || isSnowCode(h.weather_code[i])) ? "Snow" : "Rain"; };
  var wet = function(i){ return (h.precipitation_probability[i]||0)>=50; };
  if (wet(i0)){ for (var i=i0+1;i<i0+12 && i<h.time.length;i++) if (!wet(i)) return kind(i0)+" likely until about "+hourLabel(h.time[i]);
    return kind(i0)+" likely for the next several hours"; }
  for (var j=i0+1;j<=i0+6 && j<h.time.length;j++) if (wet(j)) return kind(j)+" likely starting around "+hourLabel(h.time[j]);
  var mx = 0; for (var k=i0;k<=i0+6 && k<h.time.length;k++) mx = Math.max(mx, h.precipitation_probability[k]||0);
  return mx<20 ? "Dry for the next 6 hours" : "Slight chance of showers in the next 6 hours";
}

function todayKey(){ var n = new Date(); return n.getFullYear()+"-"+(n.getMonth()+1)+"-"+n.getDate(); }
function readCalFromUrl(){
  var m = location.hash.match(/^#cal=(.*)$/); if (!m) return;
  var raw = m[1]; try { raw = decodeURIComponent(raw); } catch(e){}
  var events = raw.split("~").map(function(x){ return x.trim(); }).filter(Boolean).map(function(line){
    var p = line.split("|").map(function(x){ return x.trim(); });
    if (p.length===1) return {time:"", title:p[0], cal:""};
    var tm = /^12:00\s*AM$/i.test(p[0]) ? "All day" : p[0];
    return {time:tm, title:p[1]||"", cal:p[2]||""};
  });
  var SKIP = /\bNYSE\b|\bNasdaq\b|stock market|market (open|close|holiday)/i;  // market-calendar items stay off the gym screen
  events = events.filter(function(e){ return !SKIP.test(e.title) && !SKIP.test(e.cal); });
  save("gw-cal", {day:todayKey(), events:events, cleared:false});
  try { history.replaceState(null, "", location.pathname+location.search); } catch(e){}
}
function renderCal(){
  var c = load("gw-cal", null), hr = new Date().getHours();
  var on = !!(c && c.day===todayKey() && !c.cleared && hr<12 && boardCity===home);
  $("b-cal").classList.toggle("hidden", !on);
  $("b-strip").classList.toggle("hidden", on);
  if (!on) return;
  var d = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();
  var all = c.events || [], cards;
  var allDay = all.filter(function(e){ return e.time==="All day"; });
  var ev = all.filter(function(e){ return e.time!=="All day"; });
  if (!ev.length) cards = '<div class="ev quiet"><div class="tt">'+(allDay.length?'No timed appointments today':'Nothing on the calendar today')+'</div></div>';
  else {
    var shown = ev.length>4 ? ev.slice(0,3) : ev;
    cards = shown.map(function(e){
      return '<div class="ev"><div class="tm">'+esc(e.time)+'</div><div class="tt">'+esc(e.title)+'</div>'+(e.cal?'<div class="cn">'+esc(e.cal)+'</div>':'')+'</div>';
    }).join("");
    if (ev.length>4) cards += '<div class="ev quiet"><div class="tm">+'+(ev.length-3)+'</div><div class="tt">more today</div></div>';
  }
  var chips = allDay.map(function(e){ return '<span class="chip">'+esc(e.title)+'</span>'; }).join("");
  $("b-cal").innerHTML = '<div class="hd"><div class="ttl">TODAY · '+d+'<small>Clears itself at noon</small></div><div class="chips">'+chips+'</div>'+
    '<button class="pill" id="cal-clear">✕ Clear</button></div><div class="evs">'+cards+'</div>';
}
$("b-cal").addEventListener("click", function(e){
  if (!e.target.closest("#cal-clear")) return;
  var c = load("gw-cal", null); if (c){ c.cleared = true; save("gw-cal", c); }
  renderCal();
});
window.addEventListener("hashchange", function(){ readCalFromUrl(); if (boardCity===home) renderCal(); });
readCalFromUrl();
$("c-ver").textContent = VERSION;

if (load("gw-dim", false)) requestAnimationFrame(dimOn);
showBoard(); updateClock();
setInterval(function(){ updateClock(); if (boardCity===home && !$("board").classList.contains("hidden")) renderCal(); }, 15000);
setInterval(function(){ if (boardCity===home) refreshBoard(); }, REFRESH_MS);
setInterval(function(){ var n = new Date(); if (n.getHours()===3 && n.getMinutes()<1 && boardCity===home) location.reload(); }, 50000);
</script>
</body>
</html>
